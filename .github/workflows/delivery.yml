name: CI and Pages delivery

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact 40-hex commit on origin/main to verify and optionally deploy
        required: true
        type: string
      deploy:
        description: Deploy the verified revision to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && 'pages-delivery' || format('ci-{0}-{1}', github.event_name, github.ref) }}
  # Keep pending deliveries instead of replacing them when merges arrive close together.
  queue: max

env:
  NODE_VERSION: 22.23.5

jobs:
  verify:
    name: Verify exact source and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      manifest_sha: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Validate dispatched commit format
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          if [[ ! "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_ref must be an exact 40-hex commit" >&2
            exit 1
          fi

      - name: Check out selected revision with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatched commit belongs to origin/main
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(printf '%s' "$TARGET_REF" | tr 'A-F' 'a-f')"
          if ! git merge-base --is-ancestor "$TARGET_REF" refs/remotes/origin/main; then
            echo "target_ref must be an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Record exact source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Type-check all targets
        run: npm run typecheck

      - name: Check import boundaries
        run: npm run check:boundaries

      - name: Run unit tests
        run: npm run test:unit

      - name: Run contract tests
        run: npm run test:contracts

      - name: Build once
        run: npm run build

      - name: Test the built CLI
        run: npm run test:integration:built

      - name: Test Chromium and production offline behavior
        run: npm run test:browser

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record deployable file hashes
        run: npm run manifest
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}

      - name: Record final manifest hash
        id: manifest
        run: echo "sha256=$(sha256sum dist/ui/build-manifest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Package exact Pages artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/ui

  deploy:
    name: Deploy verified Pages artifact
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  hosted-smoke:
    name: Smoke-test deployed site
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: [verify, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out deployed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run hosted smoke
        id: hosted_suite
        run: npx playwright test --config=playwright.hosted.config.ts
        env:
          HOSTED_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha }}

      # The test remains a hard gate; skipped jobs are reported by the Actions graph.
      - name: Summarize hosted smoke
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERIFIED_MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha }}
          HOSTED_SMOKE_OUTCOME: ${{ steps.hosted_suite.outcome }}
          HOSTED_JOB_STATUS: ${{ job.status }}
        run: |
          source=unavailable
          manifest=unavailable
          if [[ ${VERIFIED_SOURCE_SHA:-} =~ ^[0-9a-f]{40}$ ]]; then source=$VERIFIED_SOURCE_SHA; fi
          if [[ ${VERIFIED_MANIFEST_SHA:-} =~ ^[0-9a-f]{64}$ ]]; then manifest=$VERIFIED_MANIFEST_SHA; fi
          case ${HOSTED_SMOKE_OUTCOME:-} in
            success|failure|cancelled) smoke=$HOSTED_SMOKE_OUTCOME ;;
            *) smoke='not run' ;;
          esac
          case ${HOSTED_JOB_STATUS:-} in
            success|failure|cancelled) job=$HOSTED_JOB_STATUS ;;
            *) job=unavailable ;;
          esac
          {
            printf '### Hosted smoke\n\n'
            printf -- '- Verified source: `%s`\n' "$source"
            printf -- '- Build manifest SHA-256: `%s`\n' "$manifest"
            printf -- '- hosted artifact, editor startup and bundled circuit round trip: **%s**\n' "$smoke"
            printf -- '- Hosted job status before summary: **%s**\n' "$job"
          } >> "$GITHUB_STEP_SUMMARY"

  # Reporting must not consume the hosted gate's own job budget.
  release-evidence:
    name: Retain release identity evidence (best effort)
    needs: [verify, deploy, hosted-smoke]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.deploy.result == 'success' && needs['hosted-smoke'].result == 'success' }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - name: Write release identity receipt
        id: release_receipt
        timeout-minutes: 1
        shell: bash
        env:
          VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERIFIED_MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha }}
        run: |
          [[ ${GITHUB_REPOSITORY,,} == xuaps/independent-circuit-editor ]]
          [[ ${GITHUB_WORKFLOW_REF,,} == xuaps/independent-circuit-editor/.github/workflows/delivery.yml@refs/heads/main ]]
          [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]
          [[ $VERIFIED_SOURCE_SHA =~ ^[0-9a-f]{40}$ && $VERIFIED_SOURCE_SHA == "$GITHUB_SHA" ]]
          [[ $VERIFIED_MANIFEST_SHA =~ ^[0-9a-f]{64}$ ]]
          [[ $GITHUB_RUN_ID =~ ^[1-9][0-9]{0,14}$ && $GITHUB_RUN_ATTEMPT =~ ^[1-9][0-9]{0,5}$ ]]
          umask 077
          receipt="$RUNNER_TEMP/release-receipt.json"
          ( set -o noclobber; printf '{"schema":1,"repo":"Xuaps/independent-circuit-editor","workflow":".github/workflows/delivery.yml","ref":"refs/heads/main","event":"push","runId":%s,"runAttempt":%s,"sourceSha":"%s","manifestSha":"%s","gates":{"verify":"success","deploy":"success","hostedSmoke":"success"}}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$VERIFIED_SOURCE_SHA" "$VERIFIED_MANIFEST_SHA" > "$receipt" )
          sha=$(sha256sum "$receipt" | cut -d' ' -f1)
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Upload release identity receipt
        id: release_receipt_upload
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Summarize retained release identity
        if: steps.release_receipt_upload.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        env:
          RELEASE_RECEIPT_SHA: ${{ steps.release_receipt.outputs.sha256 }}
        run: |
          [[ $RELEASE_RECEIPT_SHA =~ ^[0-9a-f]{64}$ ]]
          printf '### Release identity evidence\n\n- Raw receipt SHA-256: `%s`\n' "$RELEASE_RECEIPT_SHA" >> "$GITHUB_STEP_SUMMARY"
