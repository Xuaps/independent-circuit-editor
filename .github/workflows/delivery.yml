name: CI and Pages delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact 40-hex commit on origin/main to verify and optionally deploy
        required: true
        type: string
      deploy:
        description: Deploy the verified revision to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && 'pages-delivery' || format('ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.23.5

jobs:
  verify:
    name: Verify exact source and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      manifest_sha: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Validate dispatched commit format
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          if [[ ! "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_ref must be an exact 40-hex commit" >&2
            exit 1
          fi

      - name: Check out selected revision with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatched commit belongs to origin/main
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(printf '%s' "$TARGET_REF" | tr 'A-F' 'a-f')"
          if ! git merge-base --is-ancestor "$TARGET_REF" refs/remotes/origin/main; then
            echo "target_ref must be an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Record exact source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Type-check all targets
        run: npm run typecheck

      - name: Check import boundaries
        run: npm run check:boundaries

      - name: Run unit tests
        run: npm run test:unit

      - name: Run contract tests
        run: npm run test:contracts

      - name: Build once
        run: npm run build

      - name: Test the built CLI
        run: npm run test:integration:built

      - name: Test Chromium and production offline behavior
        run: npm run test:browser

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record deployable file hashes
        run: npm run manifest
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}

      - name: Record final manifest hash
        id: manifest
        run: echo "sha256=$(sha256sum dist/ui/build-manifest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Package exact Pages artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/ui

  deploy:
    name: Deploy verified Pages artifact
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  hosted-smoke:
    name: Smoke-test deployed site
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: [verify, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out deployed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run hosted smoke
        id: hosted_suite
        run: npx playwright test --config=playwright.hosted.config.ts
        env:
          HOSTED_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha }}

      # The test remains a hard gate; skipped jobs are reported by the Actions graph.
      - name: Summarize hosted smoke
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERIFIED_MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha }}
          HOSTED_SMOKE_OUTCOME: ${{ steps.hosted_suite.outcome }}
          HOSTED_JOB_STATUS: ${{ job.status }}
        run: |
          source=unavailable
          manifest=unavailable
          if [[ ${VERIFIED_SOURCE_SHA:-} =~ ^[0-9a-f]{40}$ ]]; then source=$VERIFIED_SOURCE_SHA; fi
          if [[ ${VERIFIED_MANIFEST_SHA:-} =~ ^[0-9a-f]{64}$ ]]; then manifest=$VERIFIED_MANIFEST_SHA; fi
          case ${HOSTED_SMOKE_OUTCOME:-} in
            success|failure|cancelled) smoke=$HOSTED_SMOKE_OUTCOME ;;
            *) smoke='not run' ;;
          esac
          case ${HOSTED_JOB_STATUS:-} in
            success|failure|cancelled) job=$HOSTED_JOB_STATUS ;;
            *) job=unavailable ;;
          esac
          {
            printf '### Hosted smoke\n\n'
            printf -- '- Verified source: `%s`\n' "$source"
            printf -- '- Build manifest SHA-256: `%s`\n' "$manifest"
            printf -- '- hosted artifact, editor startup and bundled circuit round trip: **%s**\n' "$smoke"
            printf -- '- Hosted job status before summary: **%s**\n' "$job"
          } >> "$GITHUB_STEP_SUMMARY"
